# Copy to .team-loop.yml and customize. Scripts use matching TEAM_LOOP_*
# environment variables so no YAML parser is required at runtime.
teams:
  a: Team A
  b: Team B
repository: OWNER/REPOSITORY
default_team: a
wip_limit: 2
protected_branch: main
gate_command: "make test"
deploy_command: ""
certificate_dir: ".team-loop/certificates"
risk_paths:
  - "migrations/**"
  - "infra/**"
  - ".github/workflows/**"
  - "auth/**"
  - "payments/**"
labels:
  ready: ready
  backlog: backlog
  train: train-running
  freeze: freeze
